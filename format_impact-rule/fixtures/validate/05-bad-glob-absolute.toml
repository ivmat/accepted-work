impact_version = "0.1.0"
repo = "alpha-service"

[[rules]]
id = "absolute-glob"
relation = "governs"
importance = "high"
urgency = "same-session"

[rules.when]
changed = ["/spec/**"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite"
action = "re-verify"
