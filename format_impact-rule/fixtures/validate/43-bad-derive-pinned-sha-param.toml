impact_version = "0.1.0"
repo = "alpha-service"
derive = [{ pinned-sha = { advisory = true } }]

[[rules]]
id = "derive-pinned-sha-param"
relation = "governs"
importance = "high"
urgency = "same-session"

[rules.when]
changed = ["src/*.py"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite"
action = "re-verify"
