impact_version = "0.1.0"
repo = "alpha-service"

[[rules]]
id = "cross-repo-prefix-uppercase"
relation = "pins"
importance = "high"
urgency = "same-session"

[rules.when]
changed = ["ACME:spec/**"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "somewhere"
action = "attend"
