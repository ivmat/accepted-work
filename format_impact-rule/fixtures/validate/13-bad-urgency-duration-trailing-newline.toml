impact_version = "0.1.0"
repo = "alpha-service"

[[rules]]
id = "urgency-trailing-newline"
relation = "governs"
importance = "high"
urgency = "within:7d\n"

[rules.when]
changed = ["src/*.py"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite"
action = "re-verify"
