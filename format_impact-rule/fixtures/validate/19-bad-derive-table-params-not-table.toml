impact_version = "0.1.0"
repo = "alpha-service"
derive = [{ git-cochange = "oops-not-a-table" }]

[[rules]]
id = "derive-table-params-not-table"
relation = "governs"
importance = "high"
urgency = "same-session"

[rules.when]
changed = ["src/*.py"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite"
action = "re-verify"
