impact_version = "0.1.0"
repo = "alpha-service"

[[rules]]
id = "extra-key"
relation = "governs"
importance = "high"
urgency = "same-session"
bogus_field = "not allowed"

[rules.when]
changed = ["src/*.py"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite"
action = "re-verify"
