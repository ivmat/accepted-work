impact_version = "0.1.0"
repo = "alpha-service"

[[rules]]
id = "duplicate-id"
relation = "governs"
importance = "high"
urgency = "same-session"

[rules.when]
changed = ["src/*.py"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite one"
action = "re-verify"

[[rules]]
id = "duplicate-id"
relation = "pins"
importance = "normal"
urgency = "next-maturity-event"

[rules.when]
changed = ["src/other.py"]

[rules.decided_by]
detect = "program"
fix = "human"

[[rules.must_update]]
target = "test suite two"
action = "attend"
