impact_version = "0.1.0"
repo = "alpha-service"
derive = [{ git-cochange = { min_confidence = 1e999 } }]

[[rules]]
id = "derive-params-non-finite"
relation = "governs"
importance = "high"
urgency = "same-session"

[rules.when]
changed = ["src/*.py"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite"
action = "re-verify"
