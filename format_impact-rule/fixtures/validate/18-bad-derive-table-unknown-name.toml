impact_version = "0.1.0"
repo = "alpha-service"
derive = [{ magic-deriver = {} }]

[[rules]]
id = "derive-table-unknown-name"
relation = "governs"
importance = "high"
urgency = "same-session"

[rules.when]
changed = ["src/*.py"]

[rules.decided_by]
detect = "program"
fix = "model"

[[rules.must_update]]
target = "test suite"
action = "re-verify"
